name: Windows build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: MSYS2 MINGW64 qmake
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up MSYS2 MINGW64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-matio
            mingw-w64-x86_64-hdf5
            mingw-w64-x86_64-highfive
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost

      - name: Detect MSYS2 MINGW64 paths
        shell: msys2 {0}
        run: |
          set -e
          # Verify qmake exists in one of the known locations (support both classic and Qt 6.11+ layouts)
          QMAKE_FOUND=false
          for CANDIDATE in \
              "$(command -v qmake6 2>/dev/null || true)" \
              "$(command -v qmake 2>/dev/null || true)" \
              /mingw64/bin/qmake6.bat \
              /mingw64/bin/qmake.bat \
              /mingw64/share/qt6/bin/qmake6.exe \
              /mingw64/share/qt6/bin/qmake.exe \
              /mingw64/bin/qmake6.exe \
              /mingw64/bin/qmake.exe; do
            if [ -n "$CANDIDATE" ] && [ -e "$CANDIDATE" ]; then
              echo "Found qmake at: $CANDIDATE"
              QMAKE_FOUND=true
              break
            fi
          done
          if [ "$QMAKE_FOUND" != "true" ]; then
            echo "ERROR: qmake not found in MSYS2 MINGW64"
            echo "--- /mingw64/bin (qmake/qt6 related) ---"
            ls /mingw64/bin/ | grep -iE 'qmake|qt6' || echo "(none)"
            echo "--- /mingw64/share subdirs ---"
            ls /mingw64/share/ | grep -iE 'qt' || echo "(none)"
            exit 1
          fi
          # Use cygpath to obtain Windows-style paths that work in PowerShell steps
          printf 'MSYS2_MINGW_BIN=%s\n' "$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          printf 'MSYS2_MINGW_ROOT=%s\n' "$(cygpath -w /mingw64)"    >> "$GITHUB_ENV"
          printf 'MSYS2_USR_BIN=%s\n'   "$(cygpath -w /usr/bin)"     >> "$GITHUB_ENV"
          echo "MSYS2_MINGW_BIN: $(cygpath -w /mingw64/bin)"
          echo "MSYS2_MINGW_ROOT: $(cygpath -w /mingw64)"

      - name: Prioritize MSYS2 MINGW64
        shell: pwsh
        run: |
          $mingwBin  = $env:MSYS2_MINGW_BIN
          $mingwRoot = $env:MSYS2_MINGW_ROOT
          $msysUsrBin = $env:MSYS2_USR_BIN
          $qtSearchDirs = @(
            $mingwBin,
            (Join-Path $mingwRoot 'lib\qt6\bin'),
            (Join-Path $mingwRoot 'share\qt6\bin')
          ) | Select-Object -Unique
          if (-not (Test-Path -LiteralPath $mingwBin) -or -not (Test-Path -LiteralPath $msysUsrBin)) {
            throw "MSYS2 MINGW64 directories are unavailable: bin=$mingwBin usrbin=$msysUsrBin"
          }
          ($qtSearchDirs + $msysUsrBin) -join "`n" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = (($qtSearchDirs + $msysUsrBin) -join ';') + ';' + $env:Path
          $qmakeCandidates = foreach ($searchDir in $qtSearchDirs) {
            foreach ($qmakeName in @('qmake6.exe','qmake-qt6.exe','qmake.exe','qmake6.bat','qmake-qt6.bat','qmake.bat')) {
              Join-Path $searchDir $qmakeName
            }
          }
          $qmake = $qmakeCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $qmake) {
            Write-Host "## Diagnostic: Qt-related files under $mingwRoot"
            Get-ChildItem -LiteralPath $mingwBin -File | Where-Object { $_.Name -like '*qmake*' -or $_.Name -like '*qt6*' } | Select-Object FullName | Format-Table -AutoSize | Out-String | Write-Host
            Get-ChildItem -LiteralPath $mingwRoot -Directory | Where-Object { $_.Name -like '*qt*' } | ForEach-Object { Get-ChildItem -LiteralPath $_.FullName -Recurse -File | Where-Object { $_.Name -like '*qmake*' } | Select-Object FullName } | Format-Table -AutoSize | Out-String | Write-Host
            throw 'No qmake executable found in MSYS2 MINGW64 directories.'
          }
          & $qmake -query
          mingw32-make.exe --version

      - name: Fresh deployable Release build
        shell: pwsh
        run: |
          $env:Path = "$env:MSYS2_MINGW_BIN;$env:MSYS2_USR_BIN;" + $env:Path
          New-Item -ItemType Directory -Force -Path build\ci-logs | Out-Null
          Start-Transcript -Path build\ci-logs\release-build.log -Force
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\build-msys2.ps1 -Configuration release -Clean -Deploy -BuildDir build\ci-release -DeployDir dist\LabAnalyser-release -Jobs 2 -Msys2Root $env:MSYS2_MINGW_ROOT
            if ($LASTEXITCODE -ne 0) { throw "Release build failed with exit code $LASTEXITCODE." }
          }
          finally { Stop-Transcript }

      - name: Verify deployable runtime contents
        shell: pwsh
        run: |
          $deployDir = 'dist\LabAnalyser-release'
          $requiredPatterns = @(
            'LabAnalyser.exe',
            'Qt6Core.dll',
            'Qt6Gui.dll',
            'Qt6Widgets.dll',
            'libgcc_s_seh-1.dll',
            'libstdc++-6.dll',
            'libwinpthread-1.dll',
            'libhdf5-*.dll',
            'libmatio-*.dll',
            'libfftw3-*.dll'
          )
          if (-not (Test-Path -LiteralPath $deployDir -PathType Container)) {
            throw "Deployment directory was not created: $deployDir"
          }
          foreach ($pattern in $requiredPatterns) {
            $match = Get-ChildItem -LiteralPath $deployDir -Recurse -File -Filter $pattern | Select-Object -First 1
            if ($null -eq $match) {
              throw "Required deployment runtime file is missing: $pattern"
            }
          }
          Get-ChildItem -LiteralPath $deployDir -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Full qmake test runner (offscreen)
        shell: pwsh
        run: |
          $env:Path = "$env:MSYS2_MINGW_BIN;$env:MSYS2_USR_BIN;" + $env:Path
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Force -Path build\ci-logs | Out-Null
          Start-Transcript -Path build\ci-logs\tests.log -Force
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\run-tests-msys2.ps1 -Clean -BuildRoot build\ci-tests -Jobs 2 -Msys2Root $env:MSYS2_MINGW_ROOT
            if ($LASTEXITCODE -ne 0) { throw "Test runner failed with exit code $LASTEXITCODE." }
          }
          finally { Stop-Transcript }

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msys2-build-and-test-logs
          path: build/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload deployable Windows application
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: LabAnalyser-windows-release
          path: dist/LabAnalyser-release/
          if-no-files-found: error
          retention-days: 14

  cmake-build-and-ctest:
    name: MSYS2 MINGW64 CMake and CTest
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up the qmake-parity MSYS2 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc mingw-w64-x86_64-make mingw-w64-x86_64-cmake
            mingw-w64-x86_64-qt6-base mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-matio mingw-w64-x86_64-hdf5
            mingw-w64-x86_64-highfive mingw-w64-x86_64-fftw mingw-w64-x86_64-boost
      - name: Configure, build, and test CMake parity targets
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH=/mingw64/bin:/usr/bin:$PATH
          export QT_QPA_PLATFORM=offscreen
          cmake -S . -B build/cmake-ci -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DLABANALYSER_BUILD_TESTS=ON
          cmake --build build/cmake-ci --parallel 2 2>&1 | tee build/cmake-build.log
          ctest --test-dir build/cmake-ci --output-on-failure --parallel 2 2>&1 | tee build/cmake-ctest.log
      - name: Upload CMake logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-msys2-cmake-ctest-logs
          path: |
            build/cmake-build.log
            build/cmake-ctest.log
            build/cmake-ci/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: MSYS2 MINGW64 combined coverage
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up MSYS2 MINGW64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-matio
            mingw-w64-x86_64-hdf5
            mingw-w64-x86_64-highfive
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost

      - name: Detect MSYS2 MINGW64 paths
        shell: msys2 {0}
        run: |
          printf 'MSYS2_MINGW_BIN=%s\n' "$(cygpath -w /mingw64/bin)" >> "$GITHUB_ENV"
          printf 'MSYS2_MINGW_ROOT=%s\n' "$(cygpath -w /mingw64)"    >> "$GITHUB_ENV"
          printf 'MSYS2_USR_BIN=%s\n'   "$(cygpath -w /usr/bin)"     >> "$GITHUB_ENV"

      - name: Run combined coverage in a fresh environment
        shell: pwsh
        run: |
          $mingwBin = $env:MSYS2_MINGW_BIN
          $msysUsrBin = $env:MSYS2_USR_BIN
          $env:Path = "$mingwBin;$msysUsrBin;$env:Path"
          $env:QT_QPA_PLATFORM = 'offscreen'
          New-Item -ItemType Directory -Force -Path build\ci-logs | Out-Null
          Start-Transcript -Path build\ci-logs\coverage.log -Force
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\run-coverage-msys2.ps1 -Jobs 2 -Msys2Root $env:MSYS2_MINGW_ROOT
            if ($LASTEXITCODE -ne 0) { throw "Coverage runner failed with exit code $LASTEXITCODE." }
            foreach ($report in @(
              'build\coverage-msys2-mingw64\report\coverage-summary.md',
              'build\coverage-msys2-mingw64\report\coverage-summary.json'
            )) {
              if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
                throw "Expected coverage report was not generated: $report"
              }
            }
          }
          finally { Stop-Transcript }

      - name: Add coverage summary
        shell: pwsh
        run: |
          $jsonPath = 'build\coverage-msys2-mingw64\report\coverage-summary.json'
          $report = Get-Content -LiteralPath $jsonPath -Raw | ConvertFrom-Json
          $totals = $report.Totals
          function Get-Percent([long]$covered, [long]$total) {
            if ($total -eq 0) { return 'n/a' }
            return ('{0:N2}%' -f (100.0 * $covered / $total)).Replace(',', '.')
          }
          @"
          ## Combined MSYS2/GCC coverage

          | Lines | Branches executed | Branches taken at least once | Calls | Functions |
          | --- | --- | --- | --- | --- |
          | $(Get-Percent $totals.LinesCovered $totals.LinesTotal) ($($totals.LinesCovered)/$($totals.LinesTotal)) | $(Get-Percent $totals.BranchesExecuted $totals.BranchesTotal) ($($totals.BranchesExecuted)/$($totals.BranchesTotal)) | $(Get-Percent $totals.BranchesTaken $totals.BranchesTotal) ($($totals.BranchesTaken)/$($totals.BranchesTotal)) | $(Get-Percent $totals.CallsCovered $totals.CallsTotal) ($($totals.CallsCovered)/$($totals.CallsTotal)) | $(Get-Percent $totals.FunctionsCovered $totals.FunctionsTotal) ($($totals.FunctionsCovered)/$($totals.FunctionsTotal)) |

          Scope: $($report.Scope). Exclusions: $($report.Excluded -join ', '). No coverage gate is active.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload combined coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: LabAnalyser-coverage-${{ github.sha }}
          path: |
            build/coverage-msys2-mingw64/report/coverage-summary.md
            build/coverage-msys2-mingw64/report/coverage-summary.json
            build/ci-logs/coverage.log
          if-no-files-found: warn
          retention-days: 14
